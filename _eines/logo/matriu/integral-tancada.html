<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo ∮M</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy: #1b2748; --gold: #e9a919; --yellow: #ffc94d;
          --bg: #f6f7fb; --border: #e1e5f0; --text: #1b2340; --muted: #5d6685; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 Inter, system-ui, sans-serif; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 40px 16px 60px; }
  h1 { font: 800 32px/1.1 Outfit, sans-serif; margin: 0 0 6px; }
  .lead { color: var(--muted); max-width: 72ch; margin: 0 0 28px; }
  .light { --ink: var(--navy); --acc: var(--gold); background: #fff; }
  .dark  { --ink: #e8ecf7; --acc: var(--yellow); background: #172036; }
  .combo { background: #fff; border: 1px solid var(--border); border-radius: 18px; overflow: hidden; margin-bottom: 18px; }
  .combo header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .combo h3 { margin: 0; font: 700 19px/1.2 Outfit, sans-serif; }
  .combo header p { margin: 4px 0 0; color: var(--muted); font-size: 14.5px; max-width: 80ch; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1.6fr; }
  @media (max-width: 860px) { .row { grid-template-columns: 1fr; } }
  .row > div { display: grid; place-items: center; padding: 28px 20px; min-height: 180px; }
  .row svg { max-width: 100%; }
  .big svg { height: 104px; }
  .lock svg { height: 66px; }
  .sizes { display: flex; align-items: end; gap: 18px; padding: 14px 20px; border-top: 1px solid var(--border); }
  .sizes small { color: var(--muted); margin-left: auto; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Format D · ∮ i idees per a la M</h1>
  <p class="lead">La integral de la prova anterior, ara tancada (∮) amb un cercle al mig. Al costat, sis idees per a la M, totes amb traç suau i extrems arrodonits.</p>
  <div id="combos"></div>
</div>

<script>
const SW = 8.5;                           // gruix del traç (el de Sora Bold a aquesta mida)
const TOP = 18, BASE = 82;

// Integral suau: ganxo de baix, pal inclinat i ganxo de dalt, sense punts als extrems.
const integral = x =>
  `M${x - 11} 78C${x - 9} 86 ${x - 2} 87 ${x + 1} 77` +
  `L${x + 10} 23C${x + 13} 13 ${x + 20} 13 ${x + 22} 21`;

// Idees per a la M (x = costat esquerre, amplada 48)
const M = {
  geo: x => `M${x} ${BASE}V${TOP}L${x + 24} 62L${x + 48} ${TOP}V${BASE}`,
  // Gràfica d'una quàrtica amb dos màxims i un mínim: una M sense cap cantó
  quartic: x => `M${x} ${BASE}C${x + 3} 44 ${x + 7} ${TOP} ${x + 13} ${TOP}C${x + 19} ${TOP} ${x + 20} 52 ${x + 24} 52` +
                `C${x + 28} 52 ${x + 29} ${TOP} ${x + 35} ${TOP}C${x + 41} ${TOP} ${x + 45} 44 ${x + 48} ${BASE}`,
  lower: x => `M${x} ${BASE}V52C${x} 38 ${x + 22} 38 ${x + 22} 52V${BASE}M${x + 22} 52C${x + 22} 38 ${x + 44} 38 ${x + 44} 52V${BASE}`,
  sin: x => `M${x} ${BASE}C${x + 1} 8 ${x + 23} 8 ${x + 24} ${BASE}C${x + 25} 8 ${x + 47} 8 ${x + 48} ${BASE}`,
};
// Detalls grocs de cada M
const EXTRA = {
  tangent: x => `<path d="M${x + 13} 52H${x + 35}" stroke="var(--acc)" stroke-width="3.2" stroke-linecap="round"/>`,
  axis: x => `<path d="M${x - 5} ${BASE + 6}H${x + 53}" stroke="var(--acc)" stroke-width="2.6" stroke-linecap="round"/>`,
};

function mark(v, { word = false } = {}) {
  const ix = 40, mx = 76;
  let s = `<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="${SW}">`;
  s += `<path d="${integral(ix) + M[v.m](mx)}" stroke="var(--ink)"/></g>`;
  // ∮: cercle centrat al punt mitjà del pal de la integral
  s += `<circle cx="${ix + 5.5}" cy="50" r="9" fill="none" stroke="${v.ring || "var(--ink)"}" stroke-width="5"/>`;
  if (v.extra) s += EXTRA[v.extra](mx);
  // Parèntesis arrodonits del format D
  const l = 14, r = 140;
  s += `<path d="M${l + 9} 12Q${l - 7} 50 ${l + 9} 88M${r - 9} 12Q${r + 7} 50 ${r - 9} 88" fill="none" stroke="var(--acc)" stroke-width="5" stroke-linecap="round"/>`;
  if (v.sq) s += `<path d="M${r + 5} 20A6 6 0 0 1 ${r + 17} 20C${r + 17} 25 ${r + 10} 28 ${r + 5} 34H${r + 18}" fill="none" stroke="var(--acc)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>`;
  let w = r + (v.sq ? 24 : 6);
  if (word) {
    s += `<text class="w" x="${w + 18}" y="66" font-family="Sora" font-weight="700" font-size="44" letter-spacing="-.5" fill="var(--ink)">Fent<tspan fill="var(--acc)">Mates</tspan></text>`;
    w += 18 + 236;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 ${w - 2} 92"${word ? ' data-word="1"' : ""}>${s}</svg>`;
}

const VARIANTS = [
  { m: "geo", sq: true, title: "1 · M geomètrica",
    desc: "La M de sempre, amb el mateix gruix i els cantons arrodonits. Deixa tot el protagonisme a la integral." },
  { m: "quartic", sq: true, title: "2 · M com a gràfica",
    desc: "La M és la gràfica d’una funció de quart grau: dos màxims i un mínim, sense cap cantó. Integral i funció, tot suau." },
  { m: "quartic", extra: "tangent", sq: true, title: "3 · Gràfica amb la tangent",
    desc: "La mateixa gràfica amb la recta tangent horitzontal al mínim en groc: f′(x) = 0. Integral i derivada en un sol logo." },
  { m: "sin", extra: "axis", sq: true, title: "4 · |sin x|",
    desc: "Dos arcs de la gràfica de |sin x| damunt d’un eix groc. Es llegeix com una m i és pura trigonometria." },
  { m: "lower", sq: true, title: "5 · m minúscula",
    desc: "Una m minúscula d’arcs suaus. Amb la integral, que ja sembla una f, queda «fm» en minúscules." },
  { m: "geo", ring: "var(--acc)", sq: false, title: "6 · Cercle groc, sense quadrat",
    desc: "La 1 amb el cercle de la integral en groc i sense l’exponent: el groc passa a ser el cercle." },
];

document.getElementById("combos").innerHTML = VARIANTS.map(v => `
  <section class="combo">
    <header><h3>${v.title}</h3><p>${v.desc}</p></header>
    <div class="row">
      <div class="light big">${mark(v)}</div>
      <div class="dark big">${mark(v)}</div>
      <div class="light lock">${mark(v, { word: true })}</div>
    </div>
    <div class="sizes light">${[48, 32, 20].map(h => mark(v).replace("<svg ", `<svg height="${h}" `)).join("")}<small>48 · 32 · 20 px</small></div>
  </section>`).join("");

// Ajusta l'amplada del logo amb nom quan Sora s'ha carregat
document.fonts.ready.then(() => document.querySelectorAll("svg[data-word]").forEach(svg => {
  const b = svg.getBBox();
  svg.setAttribute("viewBox", `4 4 ${b.x + b.width + 2} 92`);
}));
</script>
</body>
</html>
