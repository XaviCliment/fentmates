<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apartats dins de la unitat · FentMates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css">
<style>
body { background: var(--bg); }
.proposal-bar { background: #fff6d6; color: #5a4300; border-bottom: 1px solid #f0d98a; font-size: .92rem; padding: 10px 16px; text-align: center; }
.picker { display: flex; flex-wrap: wrap; gap: 8px; padding: 22px 0 6px; align-items: center; }
.picker button { font: 600 .92rem "Inter", sans-serif; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 8px 14px; border-radius: 999px; cursor: pointer; }
.picker button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.picker .sep { width: 1px; height: 26px; background: var(--border); margin: 0 6px; }
.explain { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px; margin: 14px 0 0; font-size: .95rem; color: var(--muted); }
.explain b { color: var(--text); }
.uhero { color: #fff; background: #3d6aa0; padding: 26px 0 30px; margin-top: 18px; border-radius: 18px; }
.uhero .container { padding: 0 24px; }
.uhero small { font: 700 .78rem "Inter"; letter-spacing: .08em; text-transform: uppercase; opacity: .9; }
.uhero h1 { color: #fff; margin: 4px 0 0; font-size: clamp(1.6rem, 4vw, 2.4rem); }
.stage { padding-bottom: 80px; }
.icards { padding-top: 16px; }

/* --- A: seccions apilades --- */
.sec { margin-top: 30px; }
.sec-h { display: flex; align-items: center; gap: 12px; font: 800 1.25rem "Outfit", sans-serif; color: var(--text); }
.sec-h .ico { width: 38px; height: 38px; border-radius: 11px; background: var(--sc); color: #fff; display: grid; place-items: center; padding: 6px; flex: none; }
.sec-h .ico svg { width: 100%; height: 100%; }
.sec-h .n { font: 600 .85rem "Inter"; color: var(--muted); }
.sec-h::after { content: ""; flex: 1; height: 2px; background: color-mix(in srgb, var(--sc) 30%, var(--border)); border-radius: 2px; }

/* --- B: columnes --- */
.cols { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 16px; padding-top: 24px; align-items: start; }
.col { background: color-mix(in srgb, var(--sc) 7%, var(--surface)); border: 1px solid color-mix(in srgb, var(--sc) 25%, var(--border)); border-radius: 18px; padding: 14px; }
.col .sec-h { font-size: 1.05rem; margin-bottom: 4px; }
.col .sec-h::after { display: none; }
.col .icards { grid-template-columns: 1fr; padding-top: 10px; gap: 12px; }
.col .icard .ill { display: none; }
@media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

/* --- C: pestanyes --- */
.tabs { display: flex; gap: 6px; border-bottom: 2px solid var(--border); margin-top: 26px; overflow-x: auto; }
.tabs button { font: 700 1rem "Outfit", sans-serif; border: 0; background: none; color: var(--muted); padding: 12px 16px; cursor: pointer;
  border-bottom: 3px solid transparent; margin-bottom: -2px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.tabs button .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--sc); }
.tabs button .c { font: 600 .78rem "Inter"; background: var(--surface-2); padding: 1px 8px; border-radius: 999px; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--sc); }

/* --- D: color per apartat --- */
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 24px; font: 600 .9rem "Inter"; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; background: var(--sc); }

/* --- E: ruta d'estudi --- */
.route { position: relative; margin-top: 28px; padding-left: 64px; }
.route::before { content: ""; position: absolute; left: 23px; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--border); }
.step { position: relative; margin-bottom: 28px; }
.step .bul { position: absolute; left: -64px; top: 0; width: 48px; height: 48px; border-radius: 50%; background: var(--sc); color: #fff;
  display: grid; place-items: center; font: 800 1.3rem "Outfit"; box-shadow: 0 0 0 6px var(--bg); }
.step .lbl { font: 800 1.2rem "Outfit"; padding-top: 10px; }
.step .lbl small { font: 500 .9rem "Inter"; color: var(--muted); margin-left: 8px; }
.step .icards { padding-top: 10px; }
@media (max-width: 600px) { .route { padding-left: 52px; } .step .bul { left: -52px; width: 40px; height: 40px; } .route::before { left: 19px; } }
</style>
</head>
<body>
<div class="proposal-bar">🔎 <b>Proposta</b> · Com separar els materials d'una unitat en Apunts, Exercicis, PAU i Calculadora · No forma part del web publicat</div>

<div class="container">
  <div class="picker" id="picker"></div>
  <div class="explain" id="explain"></div>
  <div class="uhero"><div class="container"><small id="usub"></small><h1 id="utitle"></h1></div></div>
  <div class="stage" id="stage"></div>
</div>

<script src="../../assets/js/illustrations.js"></script>
<script>
var ILL = (window.ILLUSTRATIONS || {}).items || {};
var UNIT_C = "#4e81bd"; // color del bloc (àlgebra)

// Apartats: color propi (només s'usa a la D, a la B/C com a accent) i icona
var SECS = [
  { k: "notes", name: "Apunts", c: "#4e81bd", ill: "notes", hint: "Aprén la teoria" },
  { k: "ex",    name: "Exercicis", c: "#f79645", ill: "worksheet", hint: "Practica" },
  { k: "pau",   name: "PAU", c: "#8064a1", ill: "pau", hint: "Prepara l'examen" },
  { k: "calc",  name: "Calculadora", c: "#2bb3a3", ill: "calc", hint: "Comprova amb la Casio" }
];
var UNITS = {
  batx: { sub: "Unitat 1 · Àlgebra · 2n Batx MII", title: "Matrius i determinants", items: [
    { s: "notes", h: "Apunts interactius de la unitat", d: "Obri", ill: "notes" },
    { s: "notes", h: "Formulari-resum de la unitat", d: "Les fórmules clau en una pàgina", ill: "book" },
    { s: "ex", h: "Fitxa d'exercicis per practicar", d: "PDF · 79 exercicis graduats", ill: "worksheet" },
    { s: "pau", h: "Exercicis tipus PAU", d: "59 exercicis resolts de la PAU valenciana (1999–2026)", ill: "pau" },
    { s: "calc", h: "Amb la calculadora: pas a pas", d: "Casio ClassWiz fx-991SP CW", ill: "calc" }
  ]},
  eso: { sub: "Unitat 3 · Aritmètica · 1r ESO", title: "Nombres enters", items: [
    { s: "notes", h: "Apunts interactius de la unitat", d: "Obri", ill: "notes" },
    { s: "ex", h: "Fitxa d'exercicis per practicar", d: "PDF · 54 exercicis graduats", ill: "worksheet" }
  ]}
};
var OPTS = {
  A: { name: "A · Seccions", text: "<b>Seccions apilades.</b> Cada apartat té un títol amb icona i una línia; davall, les targetes de sempre. És la més clara i la que menys canvia el disseny actual. Els apartats buits no apareixen." },
  B: { name: "B · Columnes", text: "<b>Columnes (tipus tauler).</b> Els apartats es veuen tots alhora, un al costat de l'altre, cada un amb un fons suau del seu color. Molt visual en ordinador; en mòbil es converteixen en seccions apilades. Amb 2 apartats (ESO) queden dues columnes amples." },
  C: { name: "C · Pestanyes", text: "<b>Pestanyes.</b> Dins de la unitat es tria l'apartat (amb el nombre de materials). La pàgina queda curta i neta, però cal un clic per veure la resta; útil si les unitats creixen molt. Es podria recordar l'última pestanya oberta." },
  D: { name: "D · Color per apartat", text: "<b>Color per apartat.</b> Mateixa graella, però cada targeta pren el color del seu apartat (barra lateral, etiqueta i dibuix) i van ordenades per apartat, amb una llegenda dalt. És el canvi més lleuger, però el color deixa d'indicar el bloc (àlgebra, anàlisi…) dins de la unitat." },
  E: { name: "E · Ruta d'estudi", text: "<b>Ruta d'estudi.</b> Els apartats es presenten com a passos numerats d'un recorregut: 1 Aprén → 2 Practica → 3 PAU → 4 Calculadora. Afegeix un missatge pedagògic (en quin ordre treballar la unitat) i continua sent clar en mòbil." }
};
var state = { opt: "A", unit: "batx", tab: null };

function card(it, c) {
  return '<a class="icard" href="#" onclick="return false" style="--c:' + c + '"><span class="side"></span><span class="body"><span class="kind">' +
    SECS.filter(function (s) { return s.k === it.s; })[0].name + '</span><span class="h">' + it.h + '</span><span class="d">' + it.d +
    '</span></span><span class="ill" aria-hidden="true">' + (ILL[it.ill] || "") + "</span></a>";
}
function groups(u) {
  return SECS.map(function (s) { return { s: s, items: u.items.filter(function (it) { return it.s === s.k; }) }; })
    .filter(function (g) { return g.items.length; });
}
function head(s, n) {
  return '<div class="sec-h" style="--sc:' + s.c + '"><span class="ico">' + (ILL[s.ill] || "") + "</span>" + s.name +
    ' <span class="n">' + n + "</span></div>";
}
function render() {
  var u = UNITS[state.unit], gs = groups(u), st = document.getElementById("stage"), html = "";
  document.getElementById("usub").textContent = u.sub;
  document.getElementById("utitle").textContent = u.title;
  document.getElementById("explain").innerHTML = OPTS[state.opt].text;
  if (state.opt === "A") {
    html = gs.map(function (g) { return '<section class="sec">' + head(g.s, g.items.length) + '<div class="icards">' +
      g.items.map(function (it) { return card(it, UNIT_C); }).join("") + "</div></section>"; }).join("");
  } else if (state.opt === "B") {
    html = '<div class="cols" style="--n:' + gs.length + '">' + gs.map(function (g) {
      return '<div class="col" style="--sc:' + g.s.c + '">' + head(g.s, g.items.length) + '<div class="icards">' +
        g.items.map(function (it) { return card(it, g.s.c); }).join("") + "</div></div>"; }).join("") + "</div>";
  } else if (state.opt === "C") {
    if (!gs.some(function (g) { return g.s.k === state.tab; })) state.tab = gs[0].s.k;
    var cur = gs.filter(function (g) { return g.s.k === state.tab; })[0];
    html = '<div class="tabs" role="tablist">' + gs.map(function (g) {
      return '<button role="tab" data-tab="' + g.s.k + '" aria-selected="' + (g.s.k === state.tab) + '" style="--sc:' + g.s.c + '"><span class="dot"></span>' +
        g.s.name + '<span class="c">' + g.items.length + "</span></button>"; }).join("") + "</div>" +
      '<div class="icards">' + cur.items.map(function (it) { return card(it, UNIT_C); }).join("") + "</div>";
  } else if (state.opt === "D") {
    html = '<div class="legend">' + gs.map(function (g) { return '<span style="--sc:' + g.s.c + '"><i></i>' + g.s.name + "</span>"; }).join("") + "</div>" +
      '<div class="icards">' + gs.map(function (g) { return g.items.map(function (it) { return card(it, g.s.c); }).join(""); }).join("") + "</div>";
  } else {
    html = '<div class="route">' + gs.map(function (g, i) {
      return '<div class="step" style="--sc:' + g.s.c + '"><span class="bul">' + (i + 1) + '</span><div class="lbl">' + g.s.name +
        "<small>" + g.s.hint + '</small></div><div class="icards">' + g.items.map(function (it) { return card(it, UNIT_C); }).join("") + "</div></div>"; }).join("") + "</div>";
  }
  st.innerHTML = html;
  st.querySelectorAll("[data-tab]").forEach(function (b) { b.onclick = function () { state.tab = b.dataset.tab; render(); }; });
  document.querySelectorAll("#picker button").forEach(function (b) {
    b.setAttribute("aria-pressed", b.dataset.opt === state.opt || b.dataset.unit === state.unit);
  });
}
var p = document.getElementById("picker");
p.innerHTML = Object.keys(OPTS).map(function (k) { return '<button data-opt="' + k + '">' + OPTS[k].name + "</button>"; }).join("") +
  '<span class="sep"></span><button data-unit="batx">Unitat amb 4 apartats</button><button data-unit="eso">Unitat ESO (2 apartats)</button>';
p.querySelectorAll("button").forEach(function (b) {
  b.onclick = function () { if (b.dataset.opt) state.opt = b.dataset.opt; if (b.dataset.unit) state.unit = b.dataset.unit; render(); };
});
render();
</script>
</body>
</html>
