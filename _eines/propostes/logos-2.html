<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FentMates · logos (2a ronda)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1b2748; --navy-2: #24375f; --coral: #ff7a50; --lilac: #8b7cf6; --pink: #ff8fb1; --teal: #2bb3a3; --yellow: #ffc94d; --gold: #e9a919;
    --bg: #f6f7fb; --surface: #fff; --border: #e1e5f0; --text: #1b2340; --muted: #5d6685;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 Inter, system-ui, sans-serif; }
  header { max-width: 1160px; margin: 0 auto; padding: 40px 16px 8px; }
  h1 { font: 800 32px/1.1 Outfit, sans-serif; margin: 0 0 6px; }
  header p { color: var(--muted); margin: 0; max-width: 60ch; }
  main { max-width: 1160px; margin: 0 auto; padding: 24px 16px 60px; display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; }
  .panel { aspect-ratio: 1; display: grid; place-items: center; padding: 18%; }
  .panel svg { width: 100%; height: 100%; }
  .light { --ink: var(--navy); --ink2: var(--navy-2); --paper: #fff; background: #fff; }
  .dark .mb { mix-blend-mode: screen; }
  .light .mb { mix-blend-mode: multiply; }
  .dark  { --ink: #e8ecf7; --ink2: #b9c3de; --paper: #172036; background: #172036; }
  .info { padding: 16px 18px 18px; border-top: 1px solid var(--border); display: grid; gap: 12px; }
  .info h2 { margin: 0; font: 700 19px/1.2 Outfit, sans-serif; }
  .info h2 span { color: var(--muted); font-weight: 600; margin-right: 6px; }
  .info p { margin: 0; color: var(--muted); font-size: 14.5px; }
  .lockup { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--bg); }
  .lockup svg { height: 38px; width: auto; flex: none; }
  .word { font: 800 26px/1 Outfit, sans-serif; letter-spacing: -0.01em; color: var(--navy); }
  .word b { color: var(--gold); font-weight: 800; }
  .sizes { display: flex; align-items: end; gap: 14px; }
  .sizes svg { flex: none; }
  .sizes small { color: var(--muted); font-size: 12px; margin-left: auto; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: 600 13px Inter, sans-serif; border: 1px solid var(--border); background: #fff; color: var(--text); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  button:hover { border-color: var(--navy); }
</style>
</head>
<body>
<header>
  <h1>Logos FentMates · 2a ronda</h1>
  <p>Segona ronda, més fresca: més color, formes arrodonides i un punt de joc. Les propostes de la primera ronda són a logos.html. Cada targeta mostra la marca sobre fons clar i fosc, a mides petites i al costat del nom. Els botons descarreguen l’SVG per a fitxes i apunts.</p>
</header>
<main id="grid"></main>

<script>
const C = { ink: "#1b2748", ink2: "#24375f", paper: "#ffffff", coral: "#ff7a50", teal: "#2bb3a3", yellow: "#ffc94d" };

// Each mark: viewBox + inner markup. var(--ink)/var(--ink2)/var(--paper) follow the background.
const marks = [
  {
    name: "Píndoles", vb: "0 0 120 100",
    desc: "Cada traç és una càpsula de color. On es creuen, els colors es barregen com paper de seda.",
    svg: `<g fill="none" stroke-linecap="round" stroke-width="16" class="mb">
      <path d="M22 20V80" stroke="#2bb3a3"/><path d="M22 20H48" stroke="#ffc94d"/><path d="M22 50H40" stroke="#ff7a50"/>
      <path d="M64 80V20" stroke="#8b7cf6"/><path d="M64 20L81 58" stroke="#ff8fb1"/><path d="M81 58L98 20" stroke="#ff7a50"/><path d="M98 20V80" stroke="#2bb3a3"/></g>`
  },
  {
    name: "Tangram", vb: "0 0 132 100",
    desc: "Peces de tangram: quadrats i triangles rectangles que encaixen per formar la F i la M.",
    svg: `<rect x="10" y="10" width="20" height="20" fill="#ff7a50"/>
      <polygon points="30,10 58,10 30,30" fill="#ffc94d"/>
      <rect x="10" y="30" width="20" height="60" fill="#2bb3a3"/>
      <polygon points="30,44 50,44 30,62" fill="#ff8fb1"/>
      <polygon points="64,10 64,90 84,90" fill="#8b7cf6"/>
      <polygon points="64,10 124,10 94,58" fill="#ff7a50"/>
      <polygon points="124,10 124,90 104,90" fill="#2bb3a3"/>`
  },
  {
    name: "Arc de Sant Martí", vb: "0 0 144 84",
    desc: "La M són dos arcs de colors; la F, un pal amb una càpsula i un punt. Alegre i fàcil de reconèixer.",
    svg: `<g fill="none" stroke-linecap="round">
      <path d="M15 72V20" stroke="var(--ink)" stroke-width="14"/>
      <path d="M15 20H36" stroke="#ff7a50" stroke-width="14"/>
      <path d="M36 72A22 22 0 0 1 80 72" stroke="#ff7a50" stroke-width="8"/>
      <path d="M45 72A13 13 0 0 1 71 72" stroke="#ffc94d" stroke-width="8"/>
      <path d="M88 72A22 22 0 0 1 132 72" stroke="#2bb3a3" stroke-width="8"/>
      <path d="M97 72A13 13 0 0 1 123 72" stroke="#8b7cf6" stroke-width="8"/></g>
      <circle cx="30" cy="45" r="7" fill="#2bb3a3"/>`
  },
  {
    name: "Adhesiu", vb: "0 0 100 100",
    desc: "Com un adhesiu enganxat de pressa: inclinat, vora blanca i ombra. Ideal per a capçaleres de fitxes.",
    svg: `<g transform="rotate(-8 50 50)">
      <rect x="15" y="17" width="72" height="72" rx="18" fill="var(--ink)" opacity=".18"/>
      <rect x="12" y="12" width="72" height="72" rx="18" fill="#ffc94d" stroke="#fff" stroke-width="4"/>
      <g fill="#1b2748"><rect x="23" y="30" width="8" height="36"/><rect x="23" y="30" width="20" height="8"/><rect x="23" y="45" width="15" height="7"/>
      <polygon points="46,66 46,30 54,30 61,45 68,30 76,30 76,66 68,66 68,47 61,60 54,47 54,66"/></g>
      <circle cx="74" cy="22" r="5" fill="#ff7a50"/></g>`
  },
  {
    name: "Confeti", vb: "0 0 158 86",
    desc: "Les lletres fetes amb cercles de mides diferents: la F en tons càlids i la M en tons freds, com confeti ben col·locat.",
    svg: (() => {
      const cells = [[0,0],[1,0],[2,0],[0,1],[0,2],[1,2],[0,3],[0,4],
        [4,0],[8,0],[4,1],[5,1],[7,1],[8,1],[4,2],[6,2],[8,2],[4,3],[8,3],[4,4],[8,4]];
      const cols = ["#ff7a50", "#ffc94d", "#2bb3a3", "#8b7cf6", "#2bb3a3"];
      return cells.map(([c, r], k) =>
        `<circle cx="${c*18+7}" cy="${r*18+7}" r="${[8.5, 7, 8, 6.5][(k*7 + c) % 4]}" fill="${(c < 3 ? cols.slice(0, 2) : cols.slice(2, 5))[(k + r) % (c < 3 ? 2 : 3)]}"/>`).join("");
    })()
  },
  {
    name: "Cinta", vb: "0 0 100 100",
    desc: "La lligadura de la primera ronda, però com una cinta amb degradat i la M que acaba en un punt, com un signe d’exclamació.",
    svg: `<defs><linearGradient id="cinta" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#ff7a50"/><stop offset=".55" stop-color="#ff8fb1"/><stop offset="1" stop-color="#8b7cf6"/></linearGradient></defs>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="12">
      <path d="M18 50H38" stroke="#ffc94d"/>
      <path d="M18 84V30Q18 16 32 16H44Q50 16 53 22L66 50L79 22Q81 17 84 18Q86 19 86 24V64" stroke="url(#cinta)"/></g>
      <circle cx="86" cy="84" r="7" fill="#2bb3a3"/>`
  }
];

const svgEl = (m, attrs = "") => `<svg viewBox="${m.vb}" ${attrs} xmlns="http://www.w3.org/2000/svg">${m.svg}</svg>`;

function download(m, i, theme) {
  const vars = theme === "dark" ? { ink: "#e8ecf7", ink2: "#b9c3de", paper: "#172036" } : C;
  const s = svgEl(m).replaceAll("var(--ink2)", vars.ink2).replaceAll("var(--ink)", vars.ink).replaceAll("var(--paper)", vars.paper)
    .replace('class="mb"', `style="mix-blend-mode:${theme === "dark" ? "screen" : "multiply"}"`);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([s], { type: "image/svg+xml" }));
  a.download = `logo-fentmates-r2-${i + 1}-${theme}.svg`;
  a.click();
}

document.getElementById("grid").innerHTML = marks.map((m, i) => `
  <article class="card">
    <div class="panels">
      <div class="panel light">${svgEl(m)}</div>
      <div class="panel dark">${svgEl(m)}</div>
    </div>
    <div class="info">
      <h2><span>${i + 1}</span>${m.name}</h2>
      <p>${m.desc}</p>
      <div class="lockup light">${svgEl(m)}<span class="word">Fent<b>Mates</b></span></div>
      <div class="sizes light">${svgEl(m, 'height="48"')}${svgEl(m, 'height="32"')}${svgEl(m, 'height="16"')}<small>48 · 32 · 16 px</small></div>
      <div class="row">
        <button onclick="download(marks[${i}], ${i}, 'light')">SVG clar</button>
        <button onclick="download(marks[${i}], ${i}, 'dark')">SVG fosc</button>
      </div>
    </div>
  </article>`).join("");
</script>
</body>
</html>
