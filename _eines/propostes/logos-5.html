<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FentMates · logos 5a ronda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1b2748; --navy-2: #24375f; --coral: #ff7a50; --teal: #2bb3a3; --yellow: #ffc94d; --gold: #e9a919;
    --bg: #f6f7fb; --surface: #fff; --border: #e1e5f0; --text: #1b2340; --muted: #5d6685;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 Inter, system-ui, sans-serif; }
  header { max-width: 1160px; margin: 0 auto; padding: 40px 16px 8px; }
  h1 { font: 800 32px/1.1 Outfit, sans-serif; margin: 0 0 6px; }
  header p { color: var(--muted); margin: 0; max-width: 60ch; }
  main { max-width: 1160px; margin: 0 auto; padding: 24px 16px 60px; display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; }
  .panel { aspect-ratio: 1; display: grid; place-items: center; padding: 18%; }
  .panel svg { width: 100%; height: 100%; }
  .light { --ink: var(--navy); --ink2: var(--navy-2); --acc: var(--gold); --paper: #fff; background: #fff; }
  .dark  { --ink: #e8ecf7; --ink2: #b9c3de; --acc: var(--yellow); --paper: #172036; background: #172036; }
  .info { padding: 16px 18px 18px; border-top: 1px solid var(--border); display: grid; gap: 12px; }
  .info h2 { margin: 0; font: 700 19px/1.2 Outfit, sans-serif; }
  .info h2 span { color: var(--muted); font-weight: 600; margin-right: 6px; }
  .info p { margin: 0; color: var(--muted); font-size: 14.5px; }
  .lockup { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--bg); }
  .lockup svg { height: 38px; width: auto; flex: none; }
  .word { font: 800 26px/1 Outfit, sans-serif; letter-spacing: -0.01em; color: var(--navy); }
  .word b { color: var(--gold); font-weight: 800; }
  .sizes { display: flex; align-items: end; gap: 14px; }
  .sizes svg { flex: none; }
  .sizes small { color: var(--muted); font-size: 12px; margin-left: auto; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: 600 13px Inter, sans-serif; border: 1px solid var(--border); background: #fff; color: var(--text); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  button:hover { border-color: var(--navy); }
</style>
</head>
<body>
<header>
  <h1>Logos FentMates · 5a ronda</h1>
  <p>Sis direccions diferents: més tipogràfiques i directes, amb un únic detall matemàtic en groc. Cada targeta mostra la marca sobre fons clar i fosc, a mides petites i al costat del nom. Els botons descarreguen l’SVG per a fitxes i apunts.</p>
</header>
<main id="grid"></main>

<script>
const C = { ink: "#1b2748", ink2: "#24375f", paper: "#ffffff", coral: "#ff7a50", teal: "#2bb3a3", yellow: "#ffc94d" };

// Each mark: viewBox + inner markup. var(--ink)/var(--ink2)/var(--paper) follow the background.
const L = { // lletres geomètriques de traç: F i M, d'alçada y0..y1 a partir de x
  F: (x, y0 = 18, y1 = 82, w = 28) => `M${x} ${y1}V${y0}H${x + w}M${x} ${(y0 + y1) / 2 - 1}H${x + w - 6}`,
  M: (x, y0 = 18, y1 = 82, w = 36) => `M${x} ${y1}V${y0}L${x + w / 2} ${y0 + (y1 - y0) * .6}L${x + w} ${y0}V${y1}`,
};
const ink = (d, w = 11) => `<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="${w}" stroke-linejoin="miter" stroke-miterlimit="4" stroke-linecap="butt"/>`;
const marks = [
  {
    name: "FM²", vb: "2 4 116 92",
    desc: "Fem mates al quadrat. Les dues lletres netes i un exponent groc: senzill, llegible i matemàtic.",
    svg: ink(L.F(12) + L.M(52)) +
      `<path d="M95 22.5A7 7 0 0 1 109 22.5C109 28 101 32 95 39.5H110" fill="none" stroke="var(--acc)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`
  },
  {
    name: "√FM", vb: "0 2 124 92",
    desc: "L’arrel quadrada en groc cobreix les lletres: FentMates arriba a l’arrel de les coses.",
    svg: `<path d="M5 58L13 53L24 84L36 10H120" fill="none" stroke="var(--acc)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>` +
      ink(L.F(48, 26, 82, 24) + L.M(80, 26, 82, 32), 10)
  },
  {
    name: "Matriu", vb: "0 4 124 92",
    desc: "Una matriu fila (F M): els claudàtors grocs de l’àlgebra emmarquen les lletres.",
    svg: `<path d="M15 12H6V88H15M109 12H118V88H109" fill="none" stroke="var(--acc)" stroke-width="6" stroke-linecap="square"/>` +
      ink(L.F(26, 24, 76, 24) + L.M(64, 24, 76, 32), 10)
  },
  {
    name: "Llapis", vb: "2 4 106 92",
    desc: "El pal de la F és un llapis que acaba de subratllar la M: fer mates és fer.",
    svg: `<rect x="10" y="12" width="13" height="54" fill="var(--ink)"/>
      <rect x="23" y="12" width="26" height="12" fill="var(--ink)"/><rect x="23" y="40" width="18" height="11" fill="var(--ink)"/>
      <polygon points="10,66 23,66 16.5,84" fill="var(--acc)"/><polygon points="14.6,78.5 18.4,78.5 16.5,84" fill="var(--ink)"/>
      <path d="M17 87.5Q30 85 44 87.5T100 87.5" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round"/>` +
      ink(L.M(60, 12, 76, 36))
  },
  {
    name: "Pissarra", vb: "0 6 124 88",
    desc: "Les inicials escrites amb guix en una pissarra, amb el guix groc a la safata.",
    svg: `<rect x="6" y="10" width="112" height="72" rx="6" fill="#1b2748" stroke="var(--acc)" stroke-width="5"/>
      <path d="${L.F(32, 26, 66, 20) + L.M(64, 26, 66, 28)}" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
      <path d="M14 88H110" stroke="var(--acc)" stroke-width="5" stroke-linecap="round"/>
      <rect x="84" y="83" width="16" height="5" rx="2.5" fill="#fff"/>`
  },
  {
    name: "Pila", vb: "0 0 100 100",
    desc: "El nom sencer apilat dins d’una peça quadrada, «mates» en groc: un segell tipogràfic, sense símbol.",
    svg: `<rect width="100" height="100" rx="22" fill="#1b2748"/>
      <text x="14" y="47" font-family="Outfit, sans-serif" font-weight="800" font-size="26" letter-spacing="-.5" fill="#fff">fent</text>
      <text x="14" y="73" font-family="Outfit, sans-serif" font-weight="800" font-size="26" letter-spacing="-.5" fill="#ffc94d">mates</text>`
  }
];

const svgEl = (m, attrs = "") => `<svg viewBox="${m.vb}" ${attrs} xmlns="http://www.w3.org/2000/svg">${m.svg}</svg>`;

function download(m, i, theme) {
  const vars = theme === "dark" ? { ink: "#e8ecf7", ink2: "#b9c3de", paper: "#172036", acc: "#ffc94d" } : { ...C, acc: "#e9a919" };
  const s = svgEl(m).replaceAll("var(--ink2)", vars.ink2).replaceAll("var(--ink)", vars.ink).replaceAll("var(--paper)", vars.paper).replaceAll("var(--acc)", vars.acc);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([s], { type: "image/svg+xml" }));
  a.download = `logo-fentmates-r5-${i + 1}-${theme}.svg`;
  a.click();
}

document.getElementById("grid").innerHTML = marks.map((m, i) => `
  <article class="card">
    <div class="panels">
      <div class="panel light">${svgEl(m)}</div>
      <div class="panel dark">${svgEl(m)}</div>
    </div>
    <div class="info">
      <h2><span>${i + 1}</span>${m.name}</h2>
      <p>${m.desc}</p>
      <div class="lockup light">${svgEl(m)}<span class="word">Fent<b>Mates</b></span></div>
      <div class="sizes light">${svgEl(m, 'height="48"')}${svgEl(m, 'height="32"')}${svgEl(m, 'height="16"')}<small>48 · 32 · 16 px</small></div>
      <div class="row">
        <button onclick="download(marks[${i}], ${i}, 'light')">SVG clar</button>
        <button onclick="download(marks[${i}], ${i}, 'dark')">SVG fosc</button>
      </div>
    </div>
  </article>`).join("");
</script>
</body>
</html>
