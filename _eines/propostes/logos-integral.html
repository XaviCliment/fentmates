<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FentMates · logos integral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1b2748; --navy-2: #24375f; --coral: #ff7a50; --teal: #2bb3a3; --yellow: #ffc94d; --gold: #e9a919;
    --bg: #f6f7fb; --surface: #fff; --border: #e1e5f0; --text: #1b2340; --muted: #5d6685;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 Inter, system-ui, sans-serif; }
  header { max-width: 1160px; margin: 0 auto; padding: 40px 16px 8px; }
  h1 { font: 800 32px/1.1 Outfit, sans-serif; margin: 0 0 6px; }
  header p { color: var(--muted); margin: 0; max-width: 60ch; }
  main { max-width: 1160px; margin: 0 auto; padding: 24px 16px 60px; display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; }
  .panel { aspect-ratio: 1; display: grid; place-items: center; padding: 18%; }
  .panel svg { width: 100%; height: 100%; }
  .light { --ink: var(--navy); --ink2: var(--navy-2); --acc: var(--gold); --paper: #fff; background: #fff; }
  .dark  { --ink: #e8ecf7; --ink2: #b9c3de; --acc: var(--yellow); --paper: #172036; background: #172036; }
  .info { padding: 16px 18px 18px; border-top: 1px solid var(--border); display: grid; gap: 12px; }
  .info h2 { margin: 0; font: 700 19px/1.2 Outfit, sans-serif; }
  .info h2 span { color: var(--muted); font-weight: 600; margin-right: 6px; }
  .info p { margin: 0; color: var(--muted); font-size: 14.5px; }
  .lockup { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--bg); }
  .lockup svg { height: 38px; width: auto; flex: none; }
  .word { font: 800 26px/1 Outfit, sans-serif; letter-spacing: -0.01em; color: var(--navy); }
  .word b { color: var(--gold); font-weight: 800; }
  .sizes { display: flex; align-items: end; gap: 14px; }
  .sizes svg { flex: none; }
  .sizes small { color: var(--muted); font-size: 12px; margin-left: auto; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: 600 13px Inter, sans-serif; border: 1px solid var(--border); background: #fff; color: var(--text); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  button:hover { border-color: var(--navy); }
</style>
</head>
<body>
<header>
  <h1>Logos FentMates · la F com a integral</h1>
  <p>Sis propostes on la F és un signe d’integral ∫: amb una barra horitzontal es llegeix com una f. Cada targeta mostra la marca sobre fons clar i fosc, a mides petites i al costat del nom. Els botons descarreguen l’SVG per a fitxes i apunts.</p>
</header>
<main id="grid"></main>

<script>
const C = { ink: "#1b2748", ink2: "#24375f", paper: "#ffffff", coral: "#ff7a50", teal: "#2bb3a3", yellow: "#ffc94d" };

// Each mark: viewBox + inner markup. var(--ink)/var(--ink2)/var(--paper) follow the background.
const marks = [
  {
    name: "∫M", vb: "0 4 112 92",
    desc: "La F és una integral: el signe ∫ amb una barra groga es llegeix com una f cursiva. Al costat, una M geomètrica.",
    svg: `<g transform="translate(34 50) skewX(-14) translate(-34 -50)"><g fill="none" stroke-linecap="round" stroke-width="10"><path d="M22 82A12 12 0 0 0 34 70V30A12 12 0 0 1 46 18" stroke="var(--ink)"/><path d="M23 48H45" stroke="var(--acc)"/></g><circle cx="46" cy="18" r="7" fill="var(--ink)"/><circle cx="22" cy="82" r="7" fill="var(--ink)"/></g>
      <path d="M72 82V18L88 52L104 18V82" fill="none" stroke="var(--ink)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>`
  },
  {
    name: "Àrea", vb: "0 4 124 92",
    desc: "La integral calcula una àrea: l’espai sota la V de la M està ombrejat en groc. ∫M = l’àrea de la M.",
    svg: `<polygon points="70,82 70,18 92,52 114,18 114,82" fill="var(--acc)" opacity=".45"/>
      <g transform="translate(34 50) skewX(-14) translate(-34 -50)"><g fill="none" stroke-linecap="round" stroke-width="10"><path d="M22 82A12 12 0 0 0 34 70V30A12 12 0 0 1 46 18" stroke="var(--ink)"/><path d="M23 48H45" stroke="var(--acc)"/></g><circle cx="46" cy="18" r="7" fill="var(--ink)"/><circle cx="22" cy="82" r="7" fill="var(--ink)"/></g>
      <path d="M70 82V18L92 52L114 18V82" fill="none" stroke="var(--ink)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>`
  },
  {
    name: "Lligadura ∫M", vb: "8 4 96 92",
    desc: "Un sol traç: el ganxo de dalt de la integral continua i dibuixa la M.",
    svg: `<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="10">
      <path d="M23 48H45" stroke="var(--acc)"/>
      <path d="M22 82A12 12 0 0 0 34 70V30A12 12 0 0 1 46 18H54L70 52L86 18V82" stroke="var(--ink)"/></g>
      <circle cx="22" cy="82" r="7" fill="var(--ink)"/>`
  },
  {
    name: "∫M!", vb: "8 4 96 92",
    desc: "Continua la idea FM!: integral, paràbola com a V de la M i el punt del factorial.",
    svg: `<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="10">
      <path d="M23 48H45" stroke="var(--acc)"/>
      <path d="M22 82A12 12 0 0 0 34 70V30A12 12 0 0 1 46 18H48Q68 90 88 18V64" stroke="var(--ink)"/></g>
      <circle cx="22" cy="82" r="7" fill="var(--ink)"/><circle cx="88" cy="82" r="6.5" fill="var(--acc)"/>`
  },
  {
    name: "∫ₘ", vb: "0 0 100 100",
    desc: "Integral sobre M: el signe gran i la M petita com a límit d’integració. Pensada per a favicon i avatar.",
    svg: `<rect width="100" height="100" rx="24" fill="#1b2748"/>
      <g transform="translate(6 -2) scale(.84) translate(8 10)"><g transform="translate(34 50) skewX(-14) translate(-34 -50)"><g fill="none" stroke-linecap="round" stroke-width="10"><path d="M22 82A12 12 0 0 0 34 70V30A12 12 0 0 1 46 18" stroke="#ffffff"/><path d="M23 48H45" stroke="#ffc94d"/></g><circle cx="46" cy="18" r="7" fill="#ffffff"/><circle cx="22" cy="82" r="7" fill="#ffffff"/></g></g>
      <path d="M62 82V62L69.5 74L77 62V82" fill="none" stroke="#ffc94d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`
  },
  {
    name: "Suma de Riemann", vb: "0 4 124 92",
    desc: "Sota la V de la M, quatre rectangles d’una suma de Riemann aproximen l’àrea; la integral n’és el límit.",
    svg: `<g transform="translate(34 50) skewX(-14) translate(-34 -50)"><g fill="none" stroke-linecap="round" stroke-width="10"><path d="M22 82A12 12 0 0 0 34 70V30A12 12 0 0 1 46 18" stroke="var(--ink)"/><path d="M23 48H45" stroke="var(--acc)"/></g><circle cx="46" cy="18" r="7" fill="var(--ink)"/><circle cx="22" cy="82" r="7" fill="var(--ink)"/></g>
      ${[76, 84.5, 93, 101.5].map(x => {
        const y = 52 - Math.abs(x + 3.5 - 92) / 22 * 34;
        return `<rect x="${x}" y="${y.toFixed(1)}" width="7" height="${(82 - y).toFixed(1)}" fill="var(--acc)"/>`;
      }).join("")}
      <path d="M70 82V18L92 52L114 18V82" fill="none" stroke="var(--ink)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>`
  }
];

const svgEl = (m, attrs = "") => `<svg viewBox="${m.vb}" ${attrs} xmlns="http://www.w3.org/2000/svg">${m.svg}</svg>`;

function download(m, i, theme) {
  const vars = theme === "dark" ? { ink: "#e8ecf7", ink2: "#b9c3de", paper: "#172036", acc: "#ffc94d" } : { ...C, acc: "#e9a919" };
  const s = svgEl(m).replaceAll("var(--ink2)", vars.ink2).replaceAll("var(--ink)", vars.ink).replaceAll("var(--paper)", vars.paper).replaceAll("var(--acc)", vars.acc);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([s], { type: "image/svg+xml" }));
  a.download = `logo-fentmates-integral-${i + 1}-${theme}.svg`;
  a.click();
}

document.getElementById("grid").innerHTML = marks.map((m, i) => `
  <article class="card">
    <div class="panels">
      <div class="panel light">${svgEl(m)}</div>
      <div class="panel dark">${svgEl(m)}</div>
    </div>
    <div class="info">
      <h2><span>${i + 1}</span>${m.name}</h2>
      <p>${m.desc}</p>
      <div class="lockup light">${svgEl(m)}<span class="word">Fent<b>Mates</b></span></div>
      <div class="sizes light">${svgEl(m, 'height="48"')}${svgEl(m, 'height="32"')}${svgEl(m, 'height="16"')}<small>48 · 32 · 16 px</small></div>
      <div class="row">
        <button onclick="download(marks[${i}], ${i}, 'light')">SVG clar</button>
        <button onclick="download(marks[${i}], ${i}, 'dark')">SVG fosc</button>
      </div>
    </div>
  </article>`).join("");
</script>
</body>
</html>
