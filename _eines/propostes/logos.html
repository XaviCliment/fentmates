<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FentMates · propostes de logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1b2748; --navy-2: #24375f; --coral: #ff7a50; --teal: #2bb3a3; --yellow: #ffc94d; --gold: #e9a919;
    --bg: #f6f7fb; --surface: #fff; --border: #e1e5f0; --text: #1b2340; --muted: #5d6685;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 Inter, system-ui, sans-serif; }
  header { max-width: 1160px; margin: 0 auto; padding: 40px 16px 8px; }
  h1 { font: 800 32px/1.1 Outfit, sans-serif; margin: 0 0 6px; }
  header p { color: var(--muted); margin: 0; max-width: 60ch; }
  main { max-width: 1160px; margin: 0 auto; padding: 24px 16px 60px; display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; }
  .panel { aspect-ratio: 1; display: grid; place-items: center; padding: 18%; }
  .panel svg { width: 100%; height: 100%; }
  .light { --ink: var(--navy); --ink2: var(--navy-2); --paper: #fff; background: #fff; }
  .dark  { --ink: #e8ecf7; --ink2: #b9c3de; --paper: #172036; background: #172036; }
  .info { padding: 16px 18px 18px; border-top: 1px solid var(--border); display: grid; gap: 12px; }
  .info h2 { margin: 0; font: 700 19px/1.2 Outfit, sans-serif; }
  .info h2 span { color: var(--muted); font-weight: 600; margin-right: 6px; }
  .info p { margin: 0; color: var(--muted); font-size: 14.5px; }
  .lockup { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--bg); }
  .lockup svg { height: 38px; width: auto; flex: none; }
  .word { font: 800 26px/1 Outfit, sans-serif; letter-spacing: -0.01em; color: var(--navy); }
  .word b { color: var(--gold); font-weight: 800; }
  .sizes { display: flex; align-items: end; gap: 14px; }
  .sizes svg { flex: none; }
  .sizes small { color: var(--muted); font-size: 12px; margin-left: auto; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: 600 13px Inter, sans-serif; border: 1px solid var(--border); background: #fff; color: var(--text); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  button:hover { border-color: var(--navy); }
</style>
</head>
<body>
<header>
  <h1>Logos FentMates</h1>
  <p>Sis propostes que juguen amb la F i la M a partir de formes geomètriques. Cada targeta mostra la marca sobre fons clar i fosc, a mides petites i al costat del nom. Els botons descarreguen l’SVG per a fitxes i apunts.</p>
</header>
<main id="grid"></main>

<script>
const C = { ink: "#1b2748", ink2: "#24375f", paper: "#ffffff", coral: "#ff7a50", teal: "#2bb3a3", yellow: "#ffc94d" };

// Each mark: viewBox + inner markup. var(--ink)/var(--ink2)/var(--paper) follow the background.
const marks = [
  {
    name: "Lligadura", vb: "0 0 100 100",
    desc: "Un sol traç: el pal de la F és també el primer pal de la M, i el braç superior de la F es converteix en la V central.",
    svg: `<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="11">
      <path d="M18 50H40" stroke="#ff7a50"/>
      <path d="M18 84V16H50L66 52L82 16V84" stroke="var(--ink)"/></g>`
  },
  {
    name: "f(m)", vb: "0 0 146 100",
    desc: "Notació de funció: FentMates com a f(m). Construïda amb rectes, quarts de cercle i semicercles d’un mateix gruix.",
    svg: `<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="8">
      <path d="M24 82V34A14 14 0 0 1 38 20M13 45H35" stroke="var(--ink)"/>
      <path d="M58 20A40 40 0 0 0 58 84M122 20A40 40 0 0 1 122 84" stroke="var(--ink)" opacity=".45"/>
      <path d="M68 82V57A11 11 0 0 1 90 57V82M90 57A11 11 0 0 1 112 57V82" stroke="#ff7a50"/></g>`
  },
  {
    name: "Bauhaus", vb: "0 0 100 100",
    desc: "Rectangles, un triangle i un cercle. La V de la M és un triangle invertit i el punt fa de contrapès.",
    svg: `<rect x="10" y="10" width="14" height="80" fill="var(--ink)"/>
      <rect x="24" y="10" width="22" height="14" fill="#ffc94d"/>
      <rect x="24" y="42" width="15" height="13" fill="var(--ink)"/>
      <rect x="54" y="10" width="12" height="80" fill="var(--ink)"/>
      <rect x="78" y="10" width="12" height="80" fill="var(--ink)"/>
      <polygon points="54,10 90,10 72,56" fill="#ff7a50"/>
      <circle cx="72" cy="80" r="8" fill="#2bb3a3"/>`
  },
  {
    name: "Quadrícula", vb: "0 0 158 86",
    desc: "Les lletres dibuixades sobre paper quadriculat, quadre a quadre. El centre de la M i el braç de la F porten l’accent.",
    svg: (() => {
      const F = [[0,0],[1,0],[2,0],[0,1],[0,2],[1,2],[0,3],[0,4]];
      const M = [[4,0],[8,0],[4,1],[5,1],[7,1],[8,1],[4,2],[6,2],[8,2],[4,3],[8,3],[4,4],[8,4]];
      const accent = { "1,2": "#2bb3a3", "6,2": "#ff7a50" };
      return [...F, ...M].map(([c, r]) =>
        `<rect x="${c*18}" y="${r*18}" width="14" height="14" rx="3.5" fill="${accent[c+","+r] || "var(--ink)"}"/>`).join("");
    })()
  },
  {
    name: "Cub", vb: "0 0 200 200",
    desc: "Un cub isomètric: la F en una cara, la M en l’altra i la cara superior com a accent. Geometria en 3D.",
    svg: `<polygon points="39.4,65 100,30 160.6,65 100,100" fill="#ff7a50"/>
      <polygon points="39.4,65 100,100 100,170 39.4,135" fill="var(--ink)"/>
      <polygon points="100,100 160.6,65 160.6,135 100,170" fill="var(--ink2)"/>
      <g transform="matrix(.606 .35 0 .7 39.4 65)" fill="var(--paper)">
        <rect x="26" y="18" width="15" height="64"/><rect x="26" y="18" width="50" height="15"/><rect x="26" y="44" width="36" height="14"/></g>
      <g transform="matrix(.606 -.35 0 .7 100 100)" fill="var(--paper)">
        <polygon points="18,82 18,18 34,18 50,46 66,18 82,18 82,82 67,82 67,46 50,74 33,46 33,82"/></g>`
  },
  {
    name: "Fracció", vb: "0 0 100 100",
    desc: "F sobre M: una fracció. La barra és l’únic element de color i funciona bé fins i tot com a favicon.",
    svg: `<g fill="var(--ink)">
        <rect x="37" y="8" width="9" height="34"/><rect x="37" y="8" width="27" height="9"/><rect x="37" y="22" width="20" height="8"/>
        <polygon points="29,94 29,60 38.5,60 50,77 61.5,60 71,60 71,94 62,94 62,74 50,91 38,74 38,94"/></g>
      <rect x="14" y="47" width="72" height="7" rx="3.5" fill="#ff7a50"/>`
  }
];

const svgEl = (m, attrs = "") => `<svg viewBox="${m.vb}" ${attrs} xmlns="http://www.w3.org/2000/svg">${m.svg}</svg>`;

function download(m, i, theme) {
  const vars = theme === "dark" ? { ink: "#e8ecf7", ink2: "#b9c3de", paper: "#172036" } : C;
  const s = svgEl(m).replaceAll("var(--ink2)", vars.ink2).replaceAll("var(--ink)", vars.ink).replaceAll("var(--paper)", vars.paper);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([s], { type: "image/svg+xml" }));
  a.download = `logo-fentmates-${i + 1}-${theme}.svg`;
  a.click();
}

document.getElementById("grid").innerHTML = marks.map((m, i) => `
  <article class="card">
    <div class="panels">
      <div class="panel light">${svgEl(m)}</div>
      <div class="panel dark">${svgEl(m)}</div>
    </div>
    <div class="info">
      <h2><span>${i + 1}</span>${m.name}</h2>
      <p>${m.desc}</p>
      <div class="lockup light">${svgEl(m)}<span class="word">Fent<b>Mates</b></span></div>
      <div class="sizes light">${svgEl(m, 'height="48"')}${svgEl(m, 'height="32"')}${svgEl(m, 'height="16"')}<small>48 · 32 · 16 px</small></div>
      <div class="row">
        <button onclick="download(marks[${i}], ${i}, 'light')">SVG clar</button>
        <button onclick="download(marks[${i}], ${i}, 'dark')">SVG fosc</button>
      </div>
    </div>
  </article>`).join("");
</script>
</body>
</html>
