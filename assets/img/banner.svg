<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16213d"/>
      <stop offset="0.55" stop-color="#1f3263"/>
      <stop offset="1" stop-color="#23497a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="grid5" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ff8a5c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#2bc4b0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2bc4b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#grid)"/>
  <rect width="1600" height="600" fill="url(#grid5)"/>
  <rect width="1600" height="600" fill="url(#glow)"/>
  <rect width="1600" height="600" fill="url(#glow2)"/>

  <!-- eixos -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" fill="none">
    <path d="M0 400H1600"/>
    <path d="M1200 0V600"/>
  </g>
  <!-- corbes: sinus, paràbola, exponencial -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M0 400 C 100 300, 200 300, 300 400 S 500 500, 600 400 S 800 300, 900 400 S 1100 500, 1200 400 S 1400 300, 1500 400 S 1600 450, 1650 420" stroke="#2bc4b0" stroke-opacity="0.45"/>
    <path d="M980 40 Q 1200 760 1420 40" stroke="#ff8a5c" stroke-opacity="0.55"/>
    <path d="M700 590 C 1000 585, 1150 560, 1260 470 S 1420 160, 1480 0" stroke="#ffd166" stroke-opacity="0.35"/>
  </g>
  <g fill="#ff8a5c" fill-opacity="0.8">
    <circle cx="1200" cy="400" r="6"/>
  </g>

  <!-- fórmules -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#ffffff">
    <text x="70" y="110" font-size="44" fill-opacity="0.16">f(x) = ax² + bx + c</text>
    <text x="520" y="80" font-size="40" fill-opacity="0.12">∫₀¹ x² dx = ⅓</text>
    <text x="1300" y="560" font-size="38" fill-opacity="0.16">e^{iπ} + 1 = 0</text>
    <text x="90" y="540" font-size="36" fill-opacity="0.13">a² + b² = c²</text>
    <text x="1350" y="120" font-size="46" fill-opacity="0.12">Σ n = n(n+1)/2</text>
    <text x="600" y="555" font-size="34" fill-opacity="0.12">lim  (1 + 1/n)ⁿ = e</text>
    <text x="330" y="230" font-size="60" fill-opacity="0.07">π</text>
    <text x="900" y="200" font-size="54" fill-opacity="0.08">√2</text>
    <text x="1500" y="320" font-size="58" fill-opacity="0.08">∞</text>
    <text x="40" y="320" font-size="34" fill-opacity="0.1">P(A|B)</text>
    <text x="800" y="330" font-size="32" fill-opacity="0.09">det(A) ≠ 0</text>
  </g>

  <!-- triangle i compàs -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2">
    <path d="M300 520 L460 520 L300 300 Z"/>
    <path d="M300 495 H325 V520"/>
    <circle cx="1000" cy="250" r="70" stroke-dasharray="6 8"/>
    <path d="M1000 250 L1060 214"/>
  </g>
</svg>
