<style>
:root {
  --navy: #1b2748; --accent: #ff7a50; --c: #7fa040; --suv: #00677f;

:root[data-theme="dark"] {

  --shadow: 0 10px 30px -12px rgba(0, 0, 0, .6);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1526; --surface: #172036; --surface-2: #1e2943; --text: #e8ecf7; --muted: #a1abc8; --border: #2a3654;

  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 17px/1.65 "Inter", system-ui, sans-serif; color: var(--text); background: var(--bg); }

@media (min-width: 1101px) { .wrap { max-width: 80vw; } }

/* capçalera */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.top .wrap { display: flex; align-items: center; gap: 14px; height: 62px; }
.back { text-decoration: none; font-weight: 600; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.back:hover { color: var(--text); }
.brand { margin-left: auto; text-decoration: none; font: 700 1.1rem "Outfit", sans-serif; display: flex; align-items: center; gap: 8px; }
.brand .logo { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, var(--accent), #ffc94d); font-family: Georgia, serif; font-style: italic; }

/* capçalera de la pàgina */

  color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); padding: 4px 12px; border-radius: 999px; }
.hero h1 { font-size: clamp(1.9rem, 4.5vw, 2.8rem); margin: 12px 0 6px; }
.hero p { margin: 0; color: var(--muted); }
.suv { flex: none; width: 128px; background: #fff; border-radius: 16px; padding: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); }
.suv img { display: block; width: 100%; height: auto; }

/* barra d'eines */
.toolbar { position: sticky; top: 62px; z-index: 10; background: var(--bg); padding: 12px 0; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 12px; box-shadow: var(--shadow); }
.search { flex: 1 1 220px; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 12px; padding: 0 12px; }
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { width: 100%; border: 0; background: transparent; color: var(--text); font: 1rem "Inter", sans-serif; padding: 10px 0; outline: none; }

  font: 600 .85rem "Inter", sans-serif; cursor: pointer; }

:root[data-theme="dark"] .chip[aria-pressed="true"] { background: var(--c); border-color: var(--c); }
.btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 12px; padding: 8px 12px;
  font: 600 .88rem "Inter", sans-serif; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }

.check input { width: 18px; height: 18px; accent-color: var(--c); cursor: pointer; }
.ex p { margin: 0 0 8px; }
.disp { overflow-x: auto; overflow-y: hidden; margin: 6px 0 10px; }
.parts { margin: 6px 0 0; padding-left: 0; list-style: none; counter-reset: p; }
.parts li { counter-increment: p; position: relative; padding-left: 30px; margin: 6px 0; }
.parts li::before { content: counter(p, lower-alpha) ")"; position: absolute; left: 4px; font-weight: 700; color: var(--c); }
.conds { margin: 4px 0 10px; padding-left: 22px; }
.conds li { margin: 3px 0; }
.tbl { overflow-x: auto; margin: 8px 0 12px; }
.tbl table { border-collapse: collapse; margin: 0 auto; font-size: .95rem; }
.tbl th, .tbl td { border: 1px solid var(--border); padding: 6px 12px; text-align: center; }
.tbl th { background: var(--surface-2); font-weight: 600; }
figure { margin: 10px 0 0; text-align: center; }
figure img { max-width: min(100%, 420px); height: auto; background: #fff; border-radius: 10px; padding: 6px; }
.katex { font-size: 1.05em; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.foot { color: var(--muted); font-size: .85rem; text-align: center; padding: 0 0 40px; }

/* solucions desplegables */
details.sol { margin: 14px 0 0; border: 1px dashed color-mix(in srgb, var(--c) 60%, transparent); border-radius: 12px; background: color-mix(in srgb, var(--c) 5%, var(--surface)); }
details.sol > summary { cursor: pointer; list-style: none; padding: 9px 14px; font-weight: 700; color: var(--c); user-select: none; }
details.sol > summary::-webkit-details-marker { display: none; }
details.sol > summary::before { content: "▸ "; } details.sol[open] > summary::before { content: "▾ "; }
details.sol[open] > summary .show, details.sol:not([open]) > summary .hide { display: none; }
.sol-body { padding: 0 16px 12px; border-top: 1px dashed var(--border); }
.sol-body .steps { padding-left: 1.3em; margin: 10px 0; }
.sol-body .steps > li { margin: 8px 0; }
.sol-body .steps ul { margin: 4px 0; padding-left: 1.2em; }
.sol-body .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.sol-body .res { margin: 10px 0 0; padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--c) 14%, transparent); }
.has-sol { font-size: .75rem; font-weight: 700; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); padding: 2px 8px; border-radius: 999px; }

}

<script>
var EXERCICIS = [{"conv": "Setembre 2001", "y": 2001, "m": 9, "h": "<p>Obteniu la derivada de la funció $f(x)=\\dfrac{2}{x-3}$ en el punt d’abscissa $x=4$. Expliqueu què significa el valor obtingut de la derivada. Calculeu la taxa de variació instantània en el punt d’abscissa $x=5$.<\/p>", "s": "<ol class=\"steps\"><li><strong>Derivada:<\/strong> $f(x)=\\dfrac{2}{x-3}\\Rightarrow f'(x)=\\dfrac{-2}{(x-3)^2}$.<\/li><li><strong>En $x=4$:<\/strong> $f'(4)=\\dfrac{-2}{1}=-2$. És el pendent de la recta tangent a la gràfica en el punt $(4,\\,2)$ i la taxa de variació instantània: en aquest punt la funció decreix 2 unitats per cada unitat que augmenta $x$.<\/li><li><strong>En $x=5$:<\/strong> la taxa de variació instantània és $f'(5)=\\dfrac{-2}{4}=-\\dfrac12$.<\/li><\/ol><p class=\"res\"><strong>Solució:<\/strong> $f'(4)=-2$; $TVI(5)=f'(5)=-\\frac12$<\/p>"}, {"conv": "Juny 2002", "y": 2002, "m": 6, "h": "<p>La funció $f(t)=2{,}1t^2+0{,}8t-1$, per a $0\\le t\\le 9$, en què el temps, $t$, és expressat en anys, proporciona els beneficis d’una empresa en milers d’euros entre els anys 1991 ($t=0$) i 2000 ($t=9$).<\/p><ol class=\"parts\"><li>Calculeu de forma raonada la taxa de variació mitjana del benefici d’aquesta empresa en aquest període de temps.<\/li><li>Obteniu de forma raonada la taxa de variació mitjana del benefici els dos últims anys.<\/li><li>Què podem concloure sobre la variació del benefici en els dos períodes anteriors?<\/li><\/ol>", "s": "<ol class=\"steps\"><li><strong>Valors:<\/strong> $f(0)=-1$, $f(7)=107{,}5$, $f(9)=176{,}3$.<\/li><li><strong>a)<\/strong> $$TVM[0,9]=\\frac{f(9)-f(0)}{9-0}=\\frac{176{,}3-(-1)}{9}=19{,}7$$ milers d’euros per any.<\/li><li><strong>b)<\/strong> $$TVM[7,9]=\\frac{f(9)-f(7)}{9-7}=\\frac{176{,}3-107{,}5}{2}=34{,}4$$ milers d’euros per any.<\/li><li><strong>c)<\/strong> El benefici creix en tot el període, i en els dos últims anys ho fa molt més de pressa (34,4 milers d’euros per any) que de mitjana (19,7).<\/li><\/ol><p class=\"res\"><strong>Solució:<\/strong> a) $19{,}7$ milers d’€/any; b) $34{,}4$ milers d’€/any; c) el creixement del benefici s’accelera.<\/p>"}, {"conv": "Setembre 2006", "y": 2006, "m": 9, "h": "<p class=\"xl\" style=\"margin:0 0 10px;padding:6px 12px;border-radius:8px;font-size:.92rem;background:color-mix(in srgb,var(--c) 12%,transparent)\"><strong>En aquesta unitat:<\/strong> els apartats d) i e). La resta de l’exercici és de la unitat 6 (Aplicacions de la derivada).<\/p><p>Els diners en efectiu, en euros, d’una oficina bancària durant les sis hores que roman la caixa oberta al públic ve donat per l’expressió $C(t)=2000-234t+27t^2$, essent $t$ el temps en hores transcorregut des de l’obertura. Si l’oficina obri a les 8.00 hores, determina:<\/p><ol class=\"parts\"><li>A quina hora hi ha més diners en efectiu i quants?<\/li><li>A quina hora hi ha menys diners en efectiu i quants?<\/li><li>Justifica que són màxim i mínim, respectivament.<\/li><li>Calcula la taxa de variació mitjana de l’efectiu entre les 9.00 h i les 10.00 h i entre les 13.00 h i les 14.00 h.<\/li><li>Què podem concloure sobre la variació de l’efectiu en els dos períodes anteriors?<\/li><\/ol>", "s": "<ol class=\"steps\"><li><strong>Punt crític:<\/strong> $C'(t)=54t-234=0\\iff t=\\frac{13}{3}$. Com que $C''(t)=54\\gt 0$, és un <strong>mínim<\/strong>: $C(\\frac{13}{3})=1493$. $t=\\frac{13}{3}$ h = 4 h 20 min, és a dir, a les 12.20 h.<\/li><li><strong>Extrems absoluts en $[0,6]$:<\/strong> <div class=\"tbl\"><table><tr><th>$t$<\/th><td>$0$<\/td><td>$\\frac{13}{3}$<\/td><td>$6$<\/td><\/tr><tr><th>$C(t)$<\/th><td>$2000$<\/td><td>$1493$<\/td><td>$1568$<\/td><\/tr><\/table><\/div><\/li><li><strong>a)<\/strong> El màxim és a l’obertura (8.00 h): 2000 €.<\/li><li><strong>b)<\/strong> El mínim és a les 12.20 h: 1493 €.<\/li><li><strong>c)<\/strong> $C'(t)\\lt 0$ en $[0,\\frac{13}{3})$ i $C'(t)\\gt 0$ en $(\\frac{13}{3},6]$; el mínim relatiu és absolut perquè la funció decreix abans i creix després, i el màxim absolut és el valor més gran de la taula.<\/li><li><strong>d)<\/strong> $TVM[1,2]=\\dfrac{C(2)-C(1)}{1}=1640-1793=-153$ €/h; $TVM[5,6]=C(6)-C(5)=1568-1505=63$ €/h.<\/li><li><strong>e)<\/strong> Entre les 9 i les 10 h l’efectiu disminueix (153 € per hora) i entre les 13 i les 14 h augmenta (63 € per hora).<\/li><\/ol><p class=\"res\"><strong>Solució:<\/strong> a) 8.00 h, 2000 €; b) 12.20 h, 1493 €; d) $-153$ €/h i $63$ €/h.<\/p>"}, {"conv": "Juny 2025", "y": 2025, "m": 6, "h": "<p class=\"xl\" style=\"margin:0 0 10px;padding:6px 12px;border-radius:8px;font-size:.92rem;background:color-mix(in srgb,var(--c) 12%,transparent)\"><strong>En aquesta unitat:<\/strong> l’apartat a). La resta de l’exercici és de la unitat 6 (Aplicacions de la derivada).<\/p><p>La temperatura $T$ d’un motor depèn de les seues revolucions $r$, de manera que entre 0 i 100 revolucions evoluciona seguint una tendència lineal tal que $T(r)=\\frac{r}{4}+25$. No obstant això, a partir de 100 revolucions la temperatura depèn del quadrat de revolucions, de manera que $T(r)=Ar^2+B$, amb $A$ i $B$ nombres reals.<\/p><ol class=\"parts\"><li>Tenint en compte que la funció ha de ser contínua i que la derivada de $T(r)$ en $r=1600$ val 4, determina $A$ i $B$.<\/li><li>Hi ha màxims o mínims per a la temperatura en funció de les revolucions? Justifica la resposta.<\/li><li>Un operari utilitza el motor durant 30 minuts, de manera que en el minut $m$ les revolucions que té el motor són donades per l’expressió $r(m)=5m-0{,}15m^2$. Determina en quins minuts les revolucions són màximes i mínimes, el valor d’aquestes i el valor de la temperatura en aquests moments.<\/li><\/ol>", "s": "<ol class=\"steps\"><li><strong>a)<\/strong> Per a $r\\gt 100$, $T'(r)=2Ar$: $T'(1600)=3200A=4\\iff A=\\frac{1}{800}$. Continuïtat en $r=100$: $\\frac{100}{4}+25=50=A\\cdot100^2+B=12{,}5+B\\iff B=37{,}5$.<\/li><li><strong>b)<\/strong> $T'(r)=\\frac14\\gt 0$ si $0\\lt r\\lt 100$ i $T'(r)=\\frac{r}{400}\\gt 0$ si $r\\gt 100$: la temperatura sempre creix. No hi ha màxims ni mínims relatius; l’únic extrem és el mínim absolut a l’inici, $T(0)=25$, i no té màxim.<\/li><li><strong>c)<\/strong> $r'(m)=-0{,}3m+5=0\\iff m=\\frac{50}{3}$. Com que $r''(m)=-0{,}3\\lt 0$, és un <strong>màxim<\/strong>: $r(\\frac{50}{3})=\\frac{125}{3}$. Mínim en un extrem de $[0,30]$: $r(0)=0$ i $r(30)=150-135=15$, per tant el mínim és $r=0$ en $m=0$. Temperatures (tram $r\\le100$): $T\\left(\\frac{125}{3}\\right)=\\frac{125}{12}+25=\\frac{425}{12}\\approx35{,}42$ i $T(0)=25$.<\/li><\/ol><p class=\"res\"><strong>Solució:<\/strong> a) $A=\\frac1{800}$, $B=37{,}5$; b) no (sempre creix); c) màxim en $m=\\frac{50}{3}\\approx16{,}7$ min ($r\\approx41{,}67$, $T\\approx35{,}42$); mínim en $m=0$ ($r=0$, $T=25$).<\/p>"}, {"conv": "Juny 2026", "y": 2026, "m": 6, "h": "<p class=\"xl\" style=\"margin:0 0 10px;padding:6px 12px;border-radius:8px;font-size:.92rem;background:color-mix(in srgb,var(--c) 12%,transparent)\"><strong>En aquesta unitat:<\/strong> l’apartat a). La resta de l’exercici és de la unitat 8 (Integrals).<\/p><p>El valor de mercat d’una empresa (en milions d’euros) depén del temps $t$ (en anys) i ve donat per la funció:<\/p><div class=\"disp\">$$g(t)=\\begin{cases}t^2+2 &amp; \\text{si } 0\\le t\\le 1\\\\ \\dfrac{a}{t}+2 &amp; \\text{si } 1&lt;t\\le 2\\\\ ct+\\dfrac{b}{t^2} &amp; \\text{si } 2&lt;t\\le 4\\end{cases}$$<\/div><p>Es demana:<\/p><ol class=\"parts\"><li>Tenint en compte que la funció ha de ser contínua i que $g'(3)=\\frac{23}{27}$, determineu $a$, $b$ i $c$.<\/li><li>L’empresa ha tingut tres gerents, el primer quan $t\\in[0,1]$, el segon quan $t\\in(1,2]$ i el tercer quan $t\\in(2,4]$. Determineu si amb tots els gerents el valor de mercat ha anat creixent.<\/li><li>Determineu els màxims i mínims absoluts i relatius per al valor de mercat.<\/li><li>El salari d’un gerent a l’any és cent mil vegades la integral de la funció $g$ durant el període que ha estat. Calculeu el salari del primer gerent.<\/li><\/ol>", "s": "<ol class=\"steps\"><li><strong>a)<\/strong> Continuïtat en $t=1$: $g(1)=3$ i $\\displaystyle\\lim_{t\\to1^+}\\left(\\frac at+2\\right)=a+2\\Rightarrow a=1$. En $t=2$: $g(2)=\\frac12+2=\\frac52$ i $\\displaystyle\\lim_{t\\to2^+}\\left(ct+\\frac{b}{t^2}\\right)=2c+\\frac b4\\Rightarrow 8c+b=10$. Derivada: si $2\\lt t\\lt 4$, $g'(t)=c-\\dfrac{2b}{t^3}$, i $g'(3)=c-\\dfrac{2b}{27}=\\dfrac{23}{27}\\Rightarrow 27c-2b=23$. Resolent: $b=10-8c$, $27c-20+16c=23$, $c=1$, $b=2$.<\/li><li><strong>b)<\/strong> 1r gerent: $g'(t)=2t\\ge0$, creix. 2n gerent: $g(t)=\\frac1t+2$, $g'(t)=-\\frac{1}{t^2}\\lt 0$, decreix. 3r gerent: $g(t)=t+\\frac{2}{t^2}$, $g'(t)=1-\\frac{4}{t^3}\\gt 0$ si $t\\gt \\sqrt[3]{4}\\approx1{,}59$, creix. No ha crescut amb tots: amb el segon va baixar.<\/li><li><strong>c)<\/strong> $g$ és contínua en $[0,4]$. Valors: $g(0)=2$, $g(1)=3$, $g(2)=\\frac52$, $g(4)=4+\\frac{2}{16}=\\frac{33}{8}$. Màxim relatiu en $t=1$ ($g=3$) i mínim relatiu en $t=2$ ($g=\\frac52$); màxim absolut $\\frac{33}{8}=4{,}125$ en $t=4$ i mínim absolut 2 en $t=0$.<\/li><li><strong>d)<\/strong> $100000\\cdot$ $$\\int_{0}^{1}(t^2+2)\\,dt=\\Big[\\frac{t^3}{3}+2t\\Big]_{0}^{1}=\\left(\\frac{7}{3}\\right)-\\left(0\\right)=\\frac{7}{3}$$ El salari del primer gerent és $100000\\cdot\\frac73\\approx233\\,333{,}33$ €.<\/li><li style=\"list-style:none\"><svg class=\"graf\" viewBox=\"0 0 420 302\" style=\"width:100%;max-width:420px;display:block;margin:10px auto;font:11px Inter,sans-serif\" role=\"img\" aria-label=\"Gràfica\"><defs><clipPath id=\"cp84\"><rect x=\"26\" y=\"20\" width=\"368\" height=\"262\"/><\/clipPath><\/defs><line x1=\"83.2\" y1=\"20\" x2=\"83.2\" y2=\"282\" stroke=\"currentColor\" stroke-opacity=\".08\"/><text x=\"83.2\" y=\"289.0\" text-anchor=\"middle\" fill=\"currentColor\" opacity=\".65\">0,5<\/text><line x1=\"124.1\" y1=\"20\" x2=\"124.1\" y2=\"282\" stroke=\"currentColor\" stroke-opacity=\".08\"/><text x=\"124.1\" y=\"289.0\" text-anchor=\"middle\" fill=\"currentColor\" opacity=\". <script>
(function () {
  "use strict";
  var KEY = "fentmates-pau-pau-u5-derivades";
  var PERIODS = [["tots", "Tots", 0, 9999], ["2020", "2020–2026", 2020, 9999], ["2010", "2010–2019", 2010, 2019],
                 ["2000", "2000–2009", 2000, 2009], ["1997", "1997–1999", 0, 1999]];
  // número fix per a cada exercici (ordre cronològic de la recopilació)
  EXERCICIS.forEach(function (e, i) { e.n = i + 1; });
  var state = { q: "", p: "tots", newest: true };
  var done = {};
  try { done = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} }

  var per = document.getElementById("periods");
  per.innerHTML = PERIODS.map(function (p) {
    return '<button type="button" class="chip" data-p="' + p[0] + '" aria-pressed="' + (p[0] === state.p) + '">' + p[1] + "</button>";
  }).join("");
  per.addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    state.p = b.getAttribute("data-p");
    per.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", c === b); });
    render();
  });
  var sort = document.getElementById("sort");
  function sortLabel() { sort.textContent = state.newest ? "↓ Més recents primer" : "↑ Més antics primer"; }
  sort.addEventListener("click", function () { state.newest = !state.newest; sortLabel(); render(); });
  sortLabel();
  document.getElementById("q").addEventListener("input", function () { state.q = this.value.trim().toLowerCase(); render(); });

  function plain(h) { var d = document.createElement("div"); d.innerHTML = h; return d.textContent.toLowerCase(); }
  EXERCICIS.forEach(function (e) { e.t = (e.conv + " " + plain(e.h)).toLowerCase(); });

  function progress() {
    var n = EXERCICIS.filter(function (e) { return done[e.n]; }).length;
    document.getElementById("prog-text").textContent = "Fets: " + n + " de " + EXERCICIS.length;
    document.getElementById("prog-bar").style.width = (100 * n / EXERCICIS.length) + "%";
  }

  function render() {
    var p = PERIODS.filter(function (x) { return x[0] === state.p; })[0];
    var items = EXERCICIS.filter(function (e) {
      if (e.y < p[2] || e.y > p[3]) return false;
      return !state.q || e.t.indexOf(state.q) >= 0;
    });
    items.sort(function (a, b) { return state.newest ? b.n - a.n : a.n - b.n; });
    var list = document.getElementById("list");
    list.innerHTML = items.length ? items.map(function (e) {
      return '<article class="ex' + (done[e.n] ? " done" : "") + '" id="ex' + e.n + '">' +
        '<div class="ex-head"><span class="n">' + e.n + '</span><span class="date">' + e.conv + "</span>" + (e.s ? '<span class="has-sol">✓ Amb solució</span>' : "") +
        '<label class="check"><input type="checkbox" data-n="' + e.n + '"' + (done[e.n] ? " checked" : "") + "> Fet</label></div>" +
        e.h + (e.s ? '<details class="sol noprint"><summary><span class="show">Mostra la solució</span><span class="hide">Amaga la solució</span></summary><div class="sol-body">' + e.s + "</div></details>" : "") + "</article>";
    }).join("") : '<p class="empty">No hi ha cap exercici amb aquest filtre.</p>';
    if (window.renderMathInElement) {
      renderMathInElement(list, { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }], throwOnError: false });
    }
    progress();
  }

  document.getElementById("list").addEventListener("change", function (e) {
    var n = e.target.getAttribute("data-n"); if (!n) return;
    if (e.target.checked) done[n] = 1; else delete done[n];
    save();
    e.target.closest(".ex").classList.toggle("done", e.target.checked);
    progress();
  });

  render();
  window.addEventListener("load", render);
})();
</script>
